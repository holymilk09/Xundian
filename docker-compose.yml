# SECURITY: Set DB_PASSWORD, RABBITMQ_PASSWORD, and JWT_SECRET in .env for non-dev environments

services:
  # PostgreSQL with PostGIS
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: xundian
      POSTGRES_USER: xundian
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xundian_dev}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/api/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xundian"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RabbitMQ (photo processing queue)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: xundian
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-xundian_dev}

  # Backend API
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://xundian:${DB_PASSWORD:-xundian_dev}@db:5432/xundian
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://xundian:${RABBITMQ_PASSWORD:-xundian_dev}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      GAODE_API_KEY: ${GAODE_API_KEY:-}
      GAODE_JS_KEY: ${GAODE_JS_KEY:-}
      GAODE_SECURITY_SECRET: ${GAODE_SECURITY_SECRET:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      ENABLE_DEMO_DATA: ${ENABLE_DEMO_DATA:-false}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
  # Manager Web Dashboard
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3001:3001"
    environment:
      API_URL: http://api:3000
      NEXT_PUBLIC_ENABLE_DEMO_DATA: ${NEXT_PUBLIC_ENABLE_DEMO_DATA:-false}
    depends_on:
      - api

volumes:
  pgdata:
